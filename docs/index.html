<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a one-screen tool. 3D stage on the left, reading panel on the right; they stack below 860px. */
  --bg: #e6ebee;
  --stage-a: #f4f6f7;
  --stage-b: #d3dbe0;
  --panel: #fbfcfc;
  --ink: #16212a;
  --muted: #55626e;
  --line: #d2d9de;
  --chip: #edf1f3;
  --accent: #0a7f79;
  --accent-soft: #d8eeec;
  --on-accent: #ffffff;
  --heat: #c25a12;
  --heat-soft: #f8e7d6;
  --warn: #a2441a;
  --warn-soft: #f8ebe1;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1418; --stage-a: #1b252d; --stage-b: #0b1014; --panel: #141b21; --ink: #e7edf1; --muted: #93a2ae;
    --line: #27333c; --chip: #1c262e; --accent: #46cfc3; --accent-soft: #11302e; --on-accent: #06211f;
    --heat: #f0954c; --heat-soft: #33230f; --warn: #f2a571; --warn-soft: #2c1f16;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1418; --stage-a: #1b252d; --stage-b: #0b1014; --panel: #141b21; --ink: #e7edf1; --muted: #93a2ae;
  --line: #27333c; --chip: #1c262e; --accent: #46cfc3; --accent-soft: #11302e; --on-accent: #06211f;
  --heat: #f0954c; --heat-soft: #33230f; --warn: #f2a571; --warn-soft: #2c1f16;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }

.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.bar h1 { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
.bar p { color: var(--muted); font-size: 13.5px; }
.main { flex: 1; min-height: 0; display: flex; }

/* mode switch: the page's main fork, so it gets the accent when pressed */
.modes { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 2px; flex: none; }
.modes button { padding: 6px 14px; border-radius: 99px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.modes button:hover { color: var(--ink); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-width: 0; background: radial-gradient(circle at 50% 38%, var(--stage-a), var(--stage-b)); overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.stage-head { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; pointer-events: none; }
.stage-head > div:first-child { text-shadow: 0 0 2px var(--stage-a), 0 0 8px var(--stage-a); }   /* legible over bone */
.stage-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.stage-sub { color: var(--muted); font-size: 13px; }
.phase { font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; background: var(--accent); color: var(--on-accent); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.phase:empty { display: none; }

.tools { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 2px; backdrop-filter: blur(6px); }
.seg .lab { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding: 5px 4px 5px 10px; }
.seg button { padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button.icon { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.seg button.solid { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.spacer { flex: 1; }

.ruler { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; pointer-events: none; }
.ruler span { position: absolute; left: 0; transform: translateY(-50%); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); padding-left: 18px; letter-spacing: 0.03em; }
.ruler span::before { content: ""; position: absolute; left: 0; top: 50%; width: 12px; border-top: 1px solid var(--muted); }

.tip { position: absolute; pointer-events: none; transform: translate(14px, 14px); background: var(--ink); color: var(--panel); font-size: 12.5px; font-weight: 500; padding: 4px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity 0.12s; z-index: 3; }
.tip.on { opacity: 1; }

.caption-row { flex-basis: 100%; display: flex; justify-content: center; }
.caption { max-width: 580px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 14.5px; backdrop-filter: blur(6px); display: flex; gap: 10px; align-items: baseline; }
.caption b { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
/* real time: a pressed-state toggle in the stage tools; Speed has no effect while it is on */
.seg button.rt { display: inline-flex; align-items: center; gap: 6px; }
.seg button:disabled { opacity: 0.4; pointer-events: none; }
/* hold countdown: in the caption on a wide screen, under the phase pill on a phone (where the caption is hidden) */
.count { display: inline-flex; align-items: baseline; gap: 2px; margin-left: auto; padding-left: 14px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count-n { font-size: 38px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; min-width: 2ch; text-align: right; }
.count-u { font-size: 15px; font-weight: 600; }
.caption.holding { position: relative; overflow: hidden; padding-bottom: 12px; }
.count-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent-soft); }
.count-bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.head-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.head-count { display: none; position: relative; overflow: hidden; align-items: baseline; gap: 2px; padding: 4px 12px 8px; border-radius: var(--r); border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(6px); color: var(--accent); font-variant-numeric: tabular-nums; }
.head-count .count-n { font-size: 40px; }
.rt-head { display: none; pointer-events: auto; }
.stage-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.stage-msg:empty { display: none; }
.stage-msg div { max-width: 36ch; }
.stage-msg { pointer-events: none; }
/* loading: a small pill over the last picture rather than a blank stage */
.stage-msg.loading div { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 99px; padding: 7px 16px; color: var(--ink); font-size: 14px; font-weight: 500; backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 9px; }
.stage-msg.loading div::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
[hidden] { display: none !important; }

/* ---------- panel ---------- */
.panel { width: 420px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 500; align-self: flex-start; padding: 4px 0; }
.back:hover { color: var(--ink); }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button.eyebrow:hover { color: var(--accent); }
.title { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; }
.latin { font-family: var(--font-display); font-style: italic; font-size: 17px; color: var(--muted); }
.lede { font-size: 15.5px; max-width: 62ch; }
.head { display: flex; flex-direction: column; gap: 5px; }
.sec { display: flex; flex-direction: column; gap: 9px; }
.sec > h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.sec p { max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { background: var(--chip); border: 1px solid transparent; border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.minor { background: transparent; border-color: var(--line); color: var(--muted); }
.chip.minor:hover { border-color: var(--accent); color: var(--accent); }

/* region picker: same pill as the stage controls, wraps on a phone */
.regions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: -4px; }
.region { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.region:hover { color: var(--ink); border-color: var(--muted); }
.region[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }

/* strength day cards */
.day { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; width: 100%; padding: 13px 14px 13px 16px; border: 1px solid var(--line); border-radius: var(--r); }
.day:hover { border-color: var(--accent); }
.day .day-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.day .day-n { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.15; }
.day .day-m { font-size: 12.5px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
.day .d { grid-column: 1; color: var(--muted); font-size: 14px; }
.day .go { grid-column: 2; grid-row: 1 / span 2; color: var(--muted); display: grid; place-items: center; }
.day:hover .go { color: var(--accent); }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 14.5px; align-self: flex-start; padding: 2px 0; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--muted); font-size: 14px; }

.group { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.group-btn { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; font-size: 15px; padding: 3px 0; width: 100%; }
.group-btn span:last-child { color: var(--muted); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.group-btn:hover { color: var(--accent); }
.row { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 5px 8px; margin: 0 -8px; border-radius: 7px; }
.row:hover { background: var(--chip); }
.row .n { font-weight: 500; }
.row .l { font-family: var(--font-display); font-style: italic; color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; }

.rank { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.rank:hover { border-color: var(--accent); }
.rank .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.rank .n { font-weight: 600; display: block; }
.rank .w { color: var(--muted); font-size: 14px; display: block; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.facts dt { color: var(--muted); }

.ex { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.ex:hover { border-color: var(--accent); }
.ex .play { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.ex .n { font-weight: 600; display: block; }
.ex .d { color: var(--muted); font-size: 13.5px; display: block; }
.pill { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 2px 9px; white-space: nowrap; margin-left: auto; flex: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }

.steps { counter-reset: s; display: flex; flex-direction: column; gap: 4px; }
.steps li { counter-increment: s; display: flex; gap: 11px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid transparent; color: var(--muted); transition: background 0.2s, color 0.2s; }
.steps li::before { content: counter(s); font-weight: 700; font-variant-numeric: tabular-nums; color: inherit; }
.steps li.on { background: var(--accent-soft); border-left-color: var(--accent); color: var(--ink); }

.flags { background: var(--warn-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.flags h3 { color: var(--warn); font-size: 14.5px; font-weight: 700; }
.flags p { font-size: 14px; }
.flags li { font-size: 14px; padding-left: 16px; position: relative; }
.flags li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.note { background: var(--heat-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.fine { font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.fine a { color: inherit; }

/* ---------- search: a pill in the header, results drop over the page so nothing behind moves ---------- */
.search { position: relative; display: flex; align-items: center; flex: 1 1 240px; max-width: 400px; min-width: 0; height: 36px; background: var(--chip); border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.search-icon { position: absolute; left: 12px; pointer-events: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font: inherit; font-size: 14.5px; color: var(--ink); padding: 0 6px 0 35px; outline: none; border-radius: 99px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search-key { font: 600 12px/1 var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; margin-right: 10px; background: var(--panel); }
.search:focus-within .search-key, .search.has-value .search-key { display: none; }
.search-clear { flex: none; width: 28px; height: 28px; margin-right: 4px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); text-align: center; }
.search-clear:hover { color: var(--ink); background: var(--panel); }
.search-clear:focus-visible { outline-offset: 0; border-radius: 50%; }
.search-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 320px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px color-mix(in srgb, #000 16%, transparent); padding: 5px; max-height: var(--search-max, 560px); overflow-y: auto; overscroll-behavior: contain; color: var(--ink); }
.hit { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.hit:hover { background: var(--chip); }
.hit[aria-selected="true"] { background: var(--accent-soft); }
.hit .n { font-weight: 600; display: block; }
.hit .d { color: var(--muted); font-size: 13px; display: block; }
.hit .d i { font-style: normal; color: var(--accent); }
.hit .pill { align-self: center; }
.hit.more { color: var(--accent); font-weight: 600; font-size: 14px; justify-content: center; }
.search-none { padding: 10px 12px; color: var(--muted); font-size: 14px; }

@media (max-width: 860px) {
  .bar { padding: 8px 12px; }
  .bar h1 { font-size: 19px; }
  .bar p:not(.search-none) { display: none; }
  .modes button { padding: 5px 11px; font-size: 13.5px; }
  .main { flex-direction: column; }
  .stage { flex: none; height: 54%; min-height: 300px; }
  .panel { width: auto; flex: 1; border-left: 0; border-top: 1px solid var(--line); }
  .pad { padding: 16px 16px 24px; }
  .title { font-size: 26px; }
  .caption-row { display: none; }   /* the highlighted step sits just below in the panel */
  .seg .lab { display: none; }
  .seg button { padding: 5px 9px; }
  /* search takes its own full-width row under the title and the mode switch */
  .search { order: 3; flex: 1 1 100%; max-width: none; height: 40px; }
  .search input { font-size: 16px; }   /* 16px stops iOS zooming in on focus */
  .search-key { display: none; }
  .search-pop { min-width: 0; }
  .head-count { display: inline-flex; }
  .rt-tools { display: none; }   /* a third row of tools would cover the feet: on a phone the toggle sits top right */
  .rt-head { display: inline-flex; }
}
@media (hover: none) { .search-key { display: none; } }
@media (max-width: 1100px) { .bar p:not(.search-none) { display: none; } }   /* room for the search on one row */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .count-bar { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Muscle Atlas</h1>
      <p>Find the muscle behind an ache, or plan a strength day.</p>
    </div>
    <div class="search" id="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10.5 10.5 3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" role="combobox" aria-label="Search muscles, exercises and pain" aria-autocomplete="list" aria-expanded="false" aria-controls="search-list" placeholder="Search muscles, lifts, pain" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m3.5 3.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="search-pop" id="search-pop" hidden>
        <ul id="search-list" role="listbox" aria-label="Search results"></ul>
        <p class="search-none" id="search-none" role="status" hidden>Nothing found. Try a muscle, a stretch, a lift, a training day or where it hurts.</p>
      </div>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="pain" aria-pressed="true">Pain and stretch</button>
      <button data-mode="strength" aria-pressed="false">Strength</button>
    </div>
  </header>
  <div class="main">
    <section class="stage" id="stage" aria-label="3D model">
      <canvas id="gl" tabindex="0" aria-label="3D model of the body. Use the muscle list in the panel to select muscles by keyboard."></canvas>
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <div class="stage-head">
        <div>
          <div class="stage-title" id="stage-title"></div>
          <div class="stage-sub" id="stage-sub"></div>
        </div>
        <div class="head-r">
          <div class="seg rt-head" hidden><button class="rt" data-act="real" id="btn-real-head" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 5.2V8l1.8 1.3M5.4 1.4h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Real time</button></div>
          <div class="phase" id="phase"></div>
          <div class="head-count" id="head-count" role="timer" aria-label="Hold time left" hidden><span class="count-n"></span><span class="count-u">s</span><span class="count-bar"><i></i></span></div>
        </div>
      </div>
      <div class="tip" id="tip"></div>
      <div class="tools" id="tools-anatomy" hidden>
        <div class="seg" role="group" aria-label="View">
          <span class="lab">View</span>
          <button data-view="back" aria-pressed="true">Back</button>
          <button data-view="left" aria-pressed="false">Side</button>
          <button data-view="front" aria-pressed="false">Front</button>
        </div>
        <div class="seg" role="group" aria-label="Layers shown">
          <span class="lab">Layer</span>
          <button data-depth="1" aria-pressed="true">Surface</button>
          <button data-depth="2" aria-pressed="false">2</button>
          <button data-depth="3" aria-pressed="false">3</button>
          <button data-depth="4" aria-pressed="false">Deep</button>
        </div>
        <div class="seg" id="clear-wrap" hidden><button data-act="clear">Show all muscles</button></div>
      </div>
      <div class="tools" id="tools-figure" hidden>
        <div class="caption-row"><div class="caption" id="caption"><b id="cap-n"></b><span id="cap-t"></span><span class="count" id="cap-count" role="timer" aria-label="Hold time left" hidden><span class="count-n"></span><span class="count-u">s</span></span><span class="count-bar" hidden><i></i></span></div></div>
        <div class="seg">
          <button class="icon" data-act="play" id="btn-play" aria-label="Pause"></button>
        </div>
        <div class="seg rt-tools">
          <button class="rt" data-act="real" id="btn-real" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 5.2V8l1.8 1.3M5.4 1.4h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Real time</button>
        </div>
        <div class="seg" role="group" aria-label="Speed">
          <span class="lab">Speed</span>
          <button data-speed="0.5" aria-pressed="false">Half</button>
          <button data-speed="1" aria-pressed="true">Full</button>
        </div>
        <div class="seg" role="group" aria-label="Framing">
          <span class="lab">Frame</span>
          <button data-fframe="whole" aria-pressed="true">Whole</button>
          <button data-fframe="close" aria-pressed="false">Close</button>
        </div>
        <div class="seg" role="group" aria-label="Camera angle">
          <span class="lab">Angle</span>
          <button data-fangle="best" aria-pressed="true">Best</button>
          <button data-fangle="front" aria-pressed="false">Front</button>
          <button data-fangle="side" aria-pressed="false">Side</button>
          <button data-fangle="back" aria-pressed="false">Back</button>
        </div>
        <span class="spacer"></span>
        <div class="seg"><button class="solid" data-act="to-model">Back to the model</button></div>
      </div>
      <div class="stage-msg" id="stage-msg"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
